# Enable mouse support (clicking panes, resizing, scrolling).
set -g mouse on

# Keep up to 100000 lines of scrollback per pane.
set -g history-limit 100000

# Allow tmux to set the system clipboard (requires terminal support).
set -g set-clipboard on

# On mouse drag release in copy-mode, pipe the selection to the clipboard.
# Uses wl-copy on Wayland, falls back to xclip on X11.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -i; fi"

# Same clipboard copy behavior for vi-style copy-mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "if command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -i; fi"

# Start window numbering at 1 instead of 0.
set -g base-index 1

# Start pane numbering at 1 instead of 0.
setw -g pane-base-index 1

# Renumber windows sequentially when one is closed, avoiding gaps.
set -g renumber-windows on

# Declare a 256-color capable terminal for proper color rendering.
set -g default-terminal "screen-256color"

# Notify in the status bar when activity occurs in another window.
setw -g monitor-activity on

# Show the activity notification visually in the status bar.
set -g visual-activity on

# Bind ù to split the current pane into left/right.
bind ù split-window -h

# Bind * to split the current pane into top/bottom.
bind * split-window -v

# Register TPM (Tmux Plugin Manager) as a plugin source.
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'

# Register the tmux2k status-bar theme plugin.
set -g @plugin '2KAbhishek/tmux2k'

# Select the "duo" color theme for tmux2k.
set -g @tmux2k-theme 'duo'
#set -g @tmux2k-icons-only true

# Duo theme foreground color.
set -g @tmux2k-duo-fg "#98FB98" # this will get you duo blue shown above

# Duo theme background color.
set -g @tmux2k-duo-bg "#000000" # this will set the bg for duo theme

# Plugins shown on the right side of the tmux2k status bar.
set -g @tmux2k-right-plugins "cpu ram time"

# Initialize TPM (must be the last line of the config).
run '~/.tmux/plugins/tpm/tpm'
